<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Copilot Plugin Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #333; }
        p { color: #666; line-height: 1.6; }
        .instructions {
            text-align: left;
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        pre {
            background: #2d2d2d;
            color: #ccc;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
    <!-- The Plugin CSS (after building) -->
    <link rel="stylesheet" href="./dist/widget/chat-copilot.css">
</head>
<body>

    <div class="container">
        <h1>Welcome to Your Website</h1>
        <p>This page demonstrates how to integrate the Chat Copilot widget as a plugin.</p>
    </div>

    <!-- The Plugin Script (after building) -->
    <script src="./dist/widget/chat-copilot-widget.js"></script>

</html>
